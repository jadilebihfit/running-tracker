name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync Capacitor
        run: |
          python3 build.py
          npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Langkah-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Langkah-apk
          path: Langkah-${{ github.run_number }}.apk

      - name: Publish ke halaman Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" "Langkah-${{ github.run_number }}.apk" \
            --title "Langkah APK #${{ github.run_number }}" \
            --notes "APK debug otomatis dari commit ${{ github.sha }}. Unduh dari HP Android, lalu buka file-nya untuk memasang." \
            --latest
